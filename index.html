<style>
/* VOICE: a shipped consumer booking product, bright and trustworthy, plus a clean owner console

   PICTURE: the working app; illustrated venue cards, sticky cost summary
   COLOUR and TYPE: white + warm off-white, maroon brand, marigold accent, green for available; Plus Jakarta Sans
   LAYOUT: white top bar with demo switch; customer flow; owner console with tabs; reviewer "Product thinking" page */
:root{color-scheme:light;--bg:#faf7f5;--card:#fff;--ink:#1d1418;--mute:#6e6166;--line:#ece4e7;--brand:#7d1d3f;--brand-d:#601532;--tint:#fbf0f3;--gold:#f2a900;--goldbg:#fff4d6;

*{box-sizing:border-box;min-width:0}

:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{letter-spacing:-.02em;margin:0;line-height:1.15}
.wrap{max-width:1140px;margin:0 auto;padding:0 max(4vw,16px)}
.mute{color:var(--mute)}.small{font-size:13.5px}.xs{font-size:12.5px}
.btn{border:0;min-height:46px;padding:0 20px;border-radius:12px;font-weight:700;background:var(--brand);color:#fff;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--brand-d)}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.gold{background:var(--gold);color:#2a1a00}.btn.sm{min-height:38px;padding:0 14px;font-size:14px}.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

label.f{display:block;font-size:12.5px;font-weight:700;color:var(--mute);margin-bottom:5px}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.alt{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left}.alt:hover{border-color:var(--brand)}

 return `<div class="wrap tp" style="padding:26px 0 0;max-width:960px"><span class="pill p-gold">For reviewers · 4-minute read</span><h1 style="font-size:clamp(28px,4vw,40px);margin-top:10px">Why I built ShubhVenue</h1>
 <p class="mute" style="margin-top:8px">Booking a movie seat takes 3 taps. Booking a hall for your own family function takes days of phone calls. This page explains why, and how I tried to fix it.</p>
 <div style="display:grid;gap:12px;margin-top:20px">
 ${C('1 · Where I first saw the problem','In intermediate college, a few of us were asked to find a hall for our <b>farewell</b>. We had one date. We called hall after hall: "Is this date free? How many people fit? What does it cost?" Most said "come and see" or "call back tomorrow". I remember being irritated, but I didn\'t think about it again.<br><br>Years later, the same thing happened at home. My family started looking for halls for <b>family functions</b>. Again: one fixed date, many calls, prices only on the phone, and halls that said "free" one day and "booked" the next. That\'s when I realised this wasn\'t bad luck. <b>It is how the system works.</b>')}
 ${C('2 · What I checked (secondary research)','<b>Is it big?</b> India has <b>80 lakh–1 crore weddings a year</b>, with total wedding spending of about <b>₹10 lakh crore (~$130B)</b> — second only to food and grocery (Jefferies report, June 2024). In just the 45-day Nov–Dec 2025 season, CAIT estimated <b>46 lakh weddings</b> — about 1 lakh a day. Add engagements, receptions, birthdays, naming ceremonies and office events, and nearly all of them need a hall.<br><br><b>Hasn\'t someone solved it?</b> I went through the big platforms (WedMeGood, VenueLook, Weddingz.in and Google listings). They are great for <b>discovery</b> — photos, price ranges, reviews — but the booking still runs through an enquiry, a call or a site visit. None of them showed me a <b>venue-confirmed, live calendar</b> I could book against.<br><br><b>Why?</b> I compared it with BookMyShow. Cinemas run on integrated ticketing systems, so seat 7B sold anywhere is sold everywhere. Most halls track bookings across calls, WhatsApp and a <b>paper register</b>. There is <b>no shared, live calendar</b> for any app to connect to.')}
 ${C('3 · The real problem','<span style="font-size:17px;line-height:1.5;color:var(--brand);font-weight:800">Finding halls is easy. Knowing which hall is free on your date — and what it will really cost — is the hard part.</span><br>Families need a live answer to three questions: <b>Is it free? Does it fit? Is it in budget?</b> Venues need to fill dates without answering the same call 40 times.','background:var(--tint);border:0')}
 ${C('4 · My hypotheses','<b>H1</b> Families will book faster if they see only halls that are actually free on their date.<br><b>H2</b> Showing the full cost (hall + food + GST) up front reduces "price shock" drop-offs.<br><b>H3</b> Families will pay a small, refundable advance (10%) online to lock a date, if cancellation is free for 48 hours.<br><b>H4</b> Venues will keep a live calendar if it brings them prepaid bookings and fits how they already work (WhatsApp).')}
 ${C('5 · What ShubhVenue does','<b>For families:</b> pick date, event, guests, budget → see only free halls with the full cost → compare and share with family on WhatsApp → lock the date with a 10% advance → receipts, balance reminders, free cancellation for 48 hours.<br><b>For venue owners:</b> one live calendar. Bookings from the app land instantly. Bookings that come on WhatsApp or the phone are blocked in one tap (paste the message). Plus payouts, pricing for peak and weekday dates, and site-visit requests.')}
 <div class="two">${C('Verified','• My own experience: the college farewell and family functions — many calls, no clear availability, prices only on the phone.<br>• Conversations in my family while booking halls.<br>• Secondary research: market size (Jefferies, CAIT) and how existing platforms work (they end in an enquiry or call).','border-left:4px solid var(--ok)')}${C('Assumed (to test next)','• H1–H4 above.<br>• Venues accept a 5% commission.<br>• 10% is the right advance (vs a flat amount).<br>• All venues, prices and bookings in this demo are sample data.','border-left:4px solid #d97706')}</div>
 ${C('6 · How I\'d measure success','<b>North star: confirmed bookings per 100 date-searches.</b> One number that only goes up if halls are free (supply), families trust the price (trust), and they actually pay (conversion).'+T(['Step','Metric','Why people drop','What the app does'],[['Search','% of searches with ≥1 free hall','Peak dates sell out','Nearby-date suggestions; free-hall count'],['Venue page','% who open a venue','Cards look the same','Full cost on every card; weekday offers'],['Checkout','% who start checkout','Fear of an unseen hall; family not agreed','Site visits; WhatsApp share; compare'],['Payment','% who pay','Price shock; date lost while paying','No new fees at checkout; 10-min hold'],['After','% cancelled','Regret, family disagreement','48h free cancel; clear timeline']])+'<p style="margin:10px 0 0"><b>Guardrails</b> (must never get worse): double-booking rate (target: zero) · "venue says it\'s booked" after payment · refund turnaround time.</p>')}
 <div class="two">${C('7 · How it makes money','Families pay <b>no fee</b>. The venue pays <b>5% of hall rent</b>.<br><br><b>Example:</b> ₹1,20,000 hall rent → family pays ₹12,000 advance (10% of hall rent) → ShubhVenue keeps ₹6,000 commission (5% of hall rent) → venue gets the other ₹6,000 within ~4 days, once the 48-hour cancellation window closes → family pays the ₹1,08,000 balance to the venue 7 days before the event. Food and decor are paid to the venue directly.<br><br>Because the advance (10%) is twice the commission (5%), the platform is paid upfront and never has to chase venues. For venues, 5% on a <i>confirmed, prepaid</i> booking is cheaper than paying for leads.')}${C('8 · Biggest risk, and the fix','<b>Risk:</b> an owner takes a phone booking and forgets to block it. A family pays for a date that\'s already gone. Trust is lost.<br><br><b>Fix:</b> WhatsApp intake (paste message → one tap blocks the date) · a weekly "any offline bookings?" nudge · venues that don\'t confirm lose the "Live" badge and rank lower · in production, the family gets a full refund and the venue pays a penalty (e.g. the commission it would have earned).<br><br><b>What "Live" means:</b> app bookings block the date instantly, and the venue confirms its offline bookings at least once a week. If it doesn\'t, the badge disappears.')}</div>
 ${C('9 · The one big decision','<b>Instant booking, not "request to book".</b> The strongest objection: a wedding hall isn\'t a cinema seat, because food, decor and terms are negotiated. I agree for those. But the scarce thing is the <b>date + hall</b>, and with a live calendar that can be booked like a seat. So families lock the date instantly with a refundable advance, and menu and decor are finalised with the venue afterwards. "Request and wait" would bring back the waiting I set out to remove.')}

 <div class="two">${C('What\'s next','<b>Now:</b> one area of Bangalore, 15–20 venues; give owners the calendar free so they have a reason to keep it live; show imported Google ratings so families can trust venues from day one.<br><b>Next:</b> "Verified booking" reviews (only families who held their event here can review), menu and decor packages, more areas.<br><b>Later:</b> an availability API for wedding planners and listing sites; more cities.')}${C('What I\'d cut next','Business events. Conferences need AV, breakout rooms and per-day pricing. Weddings and family functions first, done well.')}</div>

function runEvals(){const T=[],F=()=>seed(),t0=ds(Date.now()),dates=Array.from({length:90},(_,i)=>iso(t0+(i+1)*DAY)),ALL={guests:0,budget:1e9,area:'All'};
  const add=(id,n,fn)=>{let ok=false,info='';try{[ok,info]=fn()}catch(e){info='Error: '+e.message}T.push({id,n,ok,info})};
  const freeHall=(st,cond=()=>true)=>{for(const d of dates)for(const h of HALLS)if(!taken(st,h.id,d)&&cond(h,d))return [h,d];};
  add('E1','A booked or blocked hall never appears in customer search',()=>{const st=F();let bad=0,n=0;dates.forEach(d=>results(st,{...ALL,date:d}).forEach(r=>r.free.forEach(h=>{n++;if(st.cells[h.id+'|'+d])bad++})));return [bad===0&&n>0,`${n} free halls shown across 90 dates, ${bad} actually taken`]});
  add('E2','Owner blocks a date → it disappears from search instantly',()=>{const st=F(),[h,d]=freeHall(st),has=()=>results(st,{...ALL,date:d}).some(r=>r.free.some(x=>x.id===h.id));const a=has();toggleBlock(st,h.id,d);return [a&&!has(),`shown before: ${a}; after: ${has()}`]});
  add('E3','Two customers can never book the same hall on the same date',()=>{const st=F(),[h,d]=freeHall(st);const a=confirmBook(st,h.id,d,{name:'A',guests:100}),b=confirmBook(st,h.id,d,{name:'B',guests:100},'other');return [a.ok&&!b.ok,`first: ${a.ok?'booked':'blocked'}; second: ${b.ok?'booked':'blocked'}`]});
  add('E4','Checkout hold: another family can\'t book during the 10 min; released after',()=>{const st=F(),[h,d]=freeHall(st);lock(st,h.id,d,'A');const b=confirmBook(st,h.id,d,{name:'B',guests:100},'B');st.locks[h.id+'|'+d].until=Date.now()-1;const c=confirmBook(st,h.id,d,{name:'B',guests:100},'B');return [!b.ok&&c.ok,`during hold: ${b.ok?'booked':'blocked'}; after expiry: ${c.ok?'booked':'blocked'}`]});
  add('E5','Guest, budget and filters never show a hall that doesn\'t fit',()=>{const st=F();let bad=0,n=0;[50,200,400,800].forEach(g=>[100000,250000].forEach(bu=>[{},{ac:true},{veg:true},{type:'lawn'}].forEach(f=>dates.slice(0,20).forEach(d=>results(st,{date:d,guests:g,budget:bu,area:'All'},f).forEach(r=>r.free.forEach(h=>{n++;if(h.cap<g||price(st,h.id,d)>bu||(f.ac&&!r.v.am.includes('AC'))||(f.veg&&r.v.veg)||(f.type&&r.v.type!==f.type))bad++}))))));return [bad===0&&n>0,`${n} results across 32 filter combos, ${bad} violations`]});
  add('E8','Customer booking appears on owner side instantly',()=>{const st=F(),[h,d]=freeHall(st);const r=confirmBook(st,h.id,d,{name:'T',guests:100});return [st.bookings.includes(r.b)&&st.cells[h.id+'|'+d].by==='app',`${r.b.id} on owner list; calendar shows paid`]});
  add('E9','A venue with one hall booked still shows its other free hall',()=>{const st=F();const v=VENUES.find(v=>v.halls.length>1);const d=dates.find(d=>v.halls.every(h=>!taken(st,h.id,d)));confirmBook(st,v.halls[0].id,d,{name:'X',guests:10});const r=results(st,{...ALL,date:d}).find(x=>x.v.id===v.id);return [!!r&&r.free.length===v.halls.length-1,`${v.name} still shown with: ${r?r.free.map(h=>h.name).join(', '):'nothing'}`]});
  add('E10','Owner cannot unblock a date a customer paid for',()=>{const st=F(),[h,d]=freeHall(st);confirmBook(st,h.id,d,{name:'Y',guests:100});const r=toggleBlock(st,h.id,d);return [!r.ok&&!!st.cells[h.id+'|'+d],`unblock ${r.ok?'allowed':'refused'}`]});
  add('E11','Full cost adds up (hall − offer − coupon + food + decor + split GST); advance = 10%',()=>{const st=F();let bad=0,n=0;HALLS.slice(0,30).forEach(h=>[150,400].forEach(g=>[false,true].forEach(dc=>{n++;const q=quote(st,h.id,dates[20],g,'veg',dc,'');const v=ven(h.venueId);const exp=Math.round(q.pay+v.plate[0]*g+(dc?v.decor:0)+Math.round(q.hall*.18+v.plate[0]*g*.05+(dc?v.decor*.18:0)));if(q.total!==exp||q.adv!==Math.round(q.pay*.1))bad++})));return [bad===0,`${n} quotes, ${bad} wrong`]});
  add('E12','Cancel within 48h → full refund, date reopens; after 48h → advance kept',()=>{const st=F(),[h,d]=freeHall(st),[h2,d2]=freeHall(st,(x,dd)=>dd!==d);const a=confirmBook(st,h.id,d,{name:'A',guests:10}).b,b=confirmBook(st,h2.id,d2,{name:'B',guests:10}).b;const ra=cancel(st,a.id,a.at+47*H),rb=cancel(st,b.id,b.at+49*H);return [ra.refund===a.adv&&rb.refund===0&&!st.cells[h.id+'|'+d],`47h refund ${inr(ra.refund)}; 49h refund ${inr(rb.refund)}; date reopened`]});
  add('E13','Owner pricing / weekday offer changes reach customers immediately',()=>{const st=F(),v=VENUES[0],h=v.halls[0],d=dates.find(k=>isWkday(k)&&!st.peak.includes(k));st.rules[v.id].wd=0;const a=quote(st,h.id,d,10,'veg',false,'').hall;st.rules[v.id].wd=20;const b=quote(st,h.id,d,10,'veg',false,'').hall;return [b===a-Math.round(a*.2),`weekday hall rent ${inr(a)} → ${inr(b)} with 20% offer`]});
  add('E14','Nearby-date suggestions only include dates with a free hall',()=>{const st=F();let bad=0,n=0;dates.slice(0,30).forEach(d=>nearby(st,{date:d,guests:400,budget:250000,area:'All'},{}).forEach(a=>{n++;if(!results(st,{date:a.d,guests:400,budget:250000,area:'All'},{}).length)bad++}));return [bad===0&&n>0,`${n} suggestions, ${bad} wrong`]});
  add('E15','Coupon SHUBH5: 5% capped at ₹10,000, first booking only',()=>{const st=F();const big=HALLS.reduce((a,b)=>b.price>a.price?b:a),d=dates.find(k=>!taken(st,big.id,k));const q1=quote(st,big.id,d,10,'veg',false,'SHUBH5');const small=HALLS.reduce((a,b)=>b.price<a.price?b:a),d2=dates.find(k=>!taken(st,small.id,k));const q2=quote(st,small.id,d2,10,'veg',false,'shubh5');confirmBook(st,small.id,d2,{name:'Me',guests:10,mine:true,code:'SHUBH5'});const q3=coupon(st,'SHUBH5',100000);return [q1.cpn.amt===Math.min(10000,Math.round(q1.hall*.05))&&q2.cpn.amt===Math.round(q2.hall*.05)&&!q3.ok,`big hall: −${inr(q1.cpn.amt)} (cap); small hall: −${inr(q2.cpn.amt)}; 2nd booking: ${q3.ok?'allowed':'rejected'}`]});
  add('E16','Payout = advance − 5% commission (+ coupon top-up); released after cancel window',()=>{const st=F(),[h,d]=freeHall(st);const b=confirmBook(st,h.id,d,{name:'P',guests:10,mine:true,code:'SHUBH5'}).b;const p=payout(b);return [p.net===b.adv-Math.round(b.hall*.05)+b.cpn&&!p.done&&p.rel===b.at+REFUND_H*H+2*DAY,`advance ${inr(b.adv)} − commission ${inr(b.comm)} + coupon ${inr(b.cpn)} = ${inr(p.net)}, scheduled`]});
  add('E17','Paying the balance clears dues and issues a second receipt',()=>{const st=F(),[h,d]=freeHall(st);const b=confirmBook(st,h.id,d,{name:'Q',guests:10,mine:true}).b;const r=payBal(st,b.id),r2=payBal(st,b.id);return [r.ok&&!r2.ok&&b.balPaid&&b.adv+b.bal===b.pay,`paid ${inr(b.adv)} + ${inr(b.bal)} = ${inr(b.pay)}; double payment ${r2.ok?'allowed':'blocked'}`]});
  add('E18','Data covers Nov 1 2026 – Mar 31 2027 with bookings every month',()=>{const st=F();const ms={};st.bookings.forEach(b=>{const m=b.date.slice(0,7);ms[m]=(ms[m]||0)+1});const need=['2026-11','2026-12','2027-01','2027-02','2027-03'];return [need.every(m=>ms[m]>0)&&VENUES.length>=40,`${VENUES.length} venues; bookings per month: ${need.map(m=>m.slice(5)+'/'+m.slice(2,4)+': '+(ms[m]||0)).join(', ')}`]});
  add('E19','WhatsApp intake reads date/name/guests and blocking hides the hall from search',()=>{const st=F();const p=parseWA('Hi, this is Lakshmi. Need hall for wedding on 14th Feb, 450 guests');const h=VENUES[0].halls[0];if(st.cells[h.id+'|'+p.date])delete st.cells[h.id+'|'+p.date];const before=results(st,{...ALL,date:p.date}).some(r=>r.free.some(x=>x.id===h.id));toggleBlock(st,h.id,p.date,'WhatsApp: Lakshmi');const after=results(st,{...ALL,date:p.date}).some(r=>r.free.some(x=>x.id===h.id));return [p.date&&p.date.endsWith('-02-14')&&p.name==='Lakshmi'&&p.guests===450&&before&&!after&&st.cells[h.id+'|'+p.date].note==='WhatsApp: Lakshmi',`parsed ${p.date} · ${p.name} · ${p.guests} guests; shown before ${before}, after ${after}`]});
  add('E20','Freshness: owner update refreshes the stamp; stale venues rank below fresh ones',()=>{const st=F();const v=VENUES.find(v=>fresh(st,v.id)>7*DAY);const was=agoTxt(fresh(st,v.id));toggleBlock(st,v.halls[0].id,dates[5]);toggleBlock(st,v.halls[0].id,dates[5]);const now=fresh(st,v.id)<MIN;return [!!v&&now,`${v?v.name:'—'}: ${was} → just now after owner edit`]});
  add('E21','Business events only show suitable venues (no mantapas or community halls for a conference)',()=>{const st=F();let bad=0,n=0;EV_BIZ.forEach(e=>dates.slice(0,30).forEach(d=>results(st,{date:d,guests:50,budget:1e9,area:'All',evt:e},{}).forEach(r=>{n++;if(!BIZ_TYPES[e].includes(r.v.type))bad++})));return [bad===0&&n>0,`${n} results for business events, ${bad} unsuitable`]});
  add('E22','Payment fails, then retried: hall stays held for that family and exactly one booking is created',()=>{const st=F(),[h,d]=freeHall(st);lock(st,h.id,d,'me');/* payment fails: nothing booked, hold kept */const heldAfterFail=lockedByOther(st,h.id,d,'other')&&!st.cells[h.id+'|'+d];const other=confirmBook(st,h.id,d,{name:'Other',guests:10},'other');const r1=confirmBook(st,h.id,d,{name:'Me',guests:10},'me');const r2=confirmBook(st,h.id,d,{name:'Me',guests:10},'me');const n=st.bookings.filter(b=>b.hid===h.id&&b.date===d).length;return [heldAfterFail&&!other.ok&&r1.ok&&!r2.ok&&n===1,`hold kept after failure: ${heldAfterFail}; other family: ${other.ok?'booked':'blocked'}; retry: ${r1.ok?'booked':'failed'}; double submit: ${r2.ok?'booked':'blocked'}; bookings: ${n}`]});
  add('E23','Robustness: messy WhatsApp messages and odd search inputs never crash or show wrong halls',()=>{const msgs=['Hi this is Ravi, marriage on 3rd march for 300 people','need hall 12/01 approx 150 pax','Reception Jan 26 , 500 guests pls confirm','hello sir','  ','Engagement on 15-02, name: Priya, 80 members'];let ok=0;msgs.forEach(m=>{try{const p=parseWA(m);if(m.trim()==='hello sir'||!m.trim()?p.date===null:!!p.date)ok++}catch(e){}});const st=F();let crash=0,bad=0;[[0,0],[-5,1e9],[100000,1e9],[300,0]].forEach(([g,b])=>{try{results(st,{date:dates[3],guests:g,budget:b,area:'All'},{}).forEach(r=>r.free.forEach(h=>{if(h.cap<g||price(st,h.id,dates[3])>b)bad++}))}catch(e){crash++}});return [ok===msgs.length&&crash===0&&bad===0,`${ok}/${msgs.length} messages read correctly (dates found or correctly not found); odd searches: ${crash} crashes, ${bad} wrong halls`]});
  const p=T.filter(t=>t.ok).length;window.__ev=T;globalThis.__T=T;return `<p><b>${p}/${T.length} automated checks passed</b> <span class="small mute">· ${new Date().toLocaleString('en-IN')}. E6 (customer books in &lt;60s) and E7 (owner blocks a date in &lt;10s) are timed with real people.</span></p>`+T.map(t=>`<div class="ev"><span class="${t.ok?'ok':'no'}">${t.ok?'PASS':'FAIL'}</span><span><b>${t.id}</b> ${esc(t.n)}<br><span class="small mute">${esc(t.info)}</span></span></div>`).join('')}
window.__runEvals=runEvals;
function panel(html){modal(`<div class="row"><h2>Test panel</h2><button class="btn ghost sm" id="mx">Close</button></div><p class="small mute">For reviewers. Checks run on a fresh copy of the sample data; your demo isn't changed.</p><div class="row" style="justify-content:flex-start;margin:10px 0"><button class="btn sm" id="re">Run evals</button><button class="btn ghost sm" id="rs">Reset demo data</button></div><div>${html||''}</div>`)}

/* ===== timer ===== */
let ti;function tick(){clearInterval(ti);const el=$('timer');if(!el||!el.dataset)return;const u=+el.dataset.until;const f=()=>{const l=u-Date.now(),e=$('tleft');if(!e)return clearInterval(ti);if(l<=0){clearInterval(ti);toast('Reservation expired — the hall is open to others again');S.view='detail';render();return}e.textContent=Math.floor(l/6e4)+':'+String(Math.floor(l/1e3)%60).padStart(2,'0')};f();ti=setInterval(f,1000)}
function copy(t,msg){try{navigator.clipboard.writeText(t).then(()=>toast(msg),()=>toast(msg+' (copy not allowed here)'))}catch(e){toast(msg)}}

/* ===== events ===== */
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-open]');if(!b)return;const d=b.dataset;
  if(d.role){S.role=d.role;render();return}
  if(d.think){S.view='thinking';if(S.screen==='login')S.screen='app';render();return}
  if(d.sw){S.role=d.sw;S.screen='app';if(S.view==='thinking'||(d.sw==='cust'&&!['search','detail','mine','short','compare','done'].includes(S.view)))S.view='search';if(d.sw==='owner')S.otab=S.newId?'over':S.otab;render();return}
  if(d.home){if(S.role==='cust')S.view='search';else S.otab='over';render();return}
  if(d.out){S.screen='login';render();return}
  if(d.heart){const i=S.short.indexOf(d.heart);i<0?S.short.push(d.heart):S.short.splice(i,1);toast(i<0?'Added to shortlist':'Removed from shortlist');soft();return}
  if(d.open){S.venue=d.open;S.hall=null;S.slot=null;S.decor=false;S.view='detail';render();return}
  if(d.v){S.view=d.v;render();return}
  if(d.fx){S.f[d.fx]=!S.f[d.fx];soft();return}
  if(d.alt){S.q.date=d.alt;render();toast('Showing '+fmt(d.alt,false));return}
  if(d.hall){S.hall=d.hall;soft();return}if(d.food){S.food=d.food;soft();return}if(d.decor){S.decor=!S.decor;soft();return}if(d.slot){S.slot=d.slot;soft();return}
  if(d.visit){S.visits.push({id:'VV'+(S.visits.length+1)+Date.now()%1000,venueId:d.visit,name:S.me.name,slot:S.slot,date:S.q.date,status:'requested',at:Date.now(),mine:true});S.slot=null;toast('Visit requested — the venue will confirm. The date is not held.');soft();return}
  if(d.share){copy('https://shubhvenue.example/v/'+d.share+'?date='+S.q.date,'Link copied — paste it in your family group');return}
  if(d.sharelist){copy('https://shubhvenue.example/s/'+S.short.join('-')+'?date='+S.q.date+'&guests='+S.q.guests,'Shortlist link copied for your family');return}
  if(d.copy){copy(d.copy,'Receipt copied');return}
  if(d.clr){S.cmp=[];soft();return}
  if(d.apply){S.cpn=$('cc').value.trim().toUpperCase();soft();return}
  if(d.book){const r=lock(S,S.hall,S.q.date);if(!r.ok){toast(r.why);S.hall=null;soft();return}S.cpn='';S.view='checkout';render();return}
  if(d.rcpt){const[i,k]=d.rcpt.split('|');modal(receipt(i,k));return}
  if(d.paybal){payBal(S,d.paybal,'online');toast('Balance paid · receipt ready');soft();modal(receipt(d.paybal,'bal'));return}
  if(d.cancel){const r=cancel(S,d.cancel);toast(r.refund?`Cancelled — ${inr(r.refund)} will be refunded`:'Cancelled — advance not refundable');soft();return}
  if(d.watch){S.watch=S.watch||[];const k=d.watch+'|'+S.q.date;if(!S.watch.includes(k))S.watch.push(k);toast('Done — we\'ll message you if this hall frees up on '+fmt(S.q.date,false));soft();return}
  if(d.sim){const r=confirmBook(S,S.hall,S.q.date,{name:'Other family',guests:100},'other-family');const o=$('simout');if(o)o.innerHTML=r.ok?'<p class="cpnno">Booked — this should not happen</p>':'<p class="cpnok">✓ Blocked: “'+esc(r.why)+'” — the hall is held for you until your timer ends.</p>';return}
  if(d.fail){const o=$('simout');if(o)o.innerHTML='<p class="cpnno">✗ Payment failed (bank declined). No money taken. The hall stays held for you until the timer ends — try again or pick another method.</p>';return}
  if(d.expire){delete S.locks[S.hall+'|'+S.q.date];toast('Hold expired — the hall is open to everyone again. You can still try to book it.');S.view='detail';render();return}
  if(d.fresh){S.upd[S.ownerVenue]=Date.now();toast('Confirmed — your “Live” badge and ranking are back');soft();return}
  if(d.wasample){S.wa='Hi sir, this is Lakshmi. Want to book your hall for my daughter\'s wedding on 14th Feb, around 450 guests. Advance I will transfer today.';soft();return}
  if(d.waparse){S.wa=$('wat').value;soft();return}if(d.wah){S.waHall=d.wah;soft();return}
  if(d.wablock){const[h,dt]=d.wablock.split('|');const p=parseWA(S.wa||'');const r=toggleBlock(S,h,dt,'WhatsApp: '+(p.name||'booking'));toast(r.ok?'Blocked — families no longer see it for '+fmt(dt,false):r.why);soft();return}
  if(d.ot){S.otab=d.ot;render();return}if(d.oh){S.ownerHall=d.oh;soft();return}if(d.bf){S.bf=d.bf;soft();return}
  if(b.id==='pm'||b.id==='nm'){S.calM+=b.id==='nm'?1:-1;soft();return}
  if(d.cell){const r=toggleBlock(S,S.ownerHall,d.cell);toast(r.ok?(r.now==='blocked'?'Blocked — hidden from customers now':'Opened — customers can book it'):r.why);soft();return}
  if(d.remind){toast('Reminder sent to the customer on SMS & WhatsApp (demo)');return}
  if(d.cash){payBal(S,d.cash,'offline');toast('Marked as received — customer gets a receipt');soft();return}
  if(d.vok||d.vno){const x=S.visits.find(v=>v.id===(d.vok||d.vno));x.status=d.vok?'confirmed':'declined';toast(d.vok?'Visit confirmed — family notified':'Visit declined');soft();return}
  if(b.id==='tp'){panel();return}if(b.id==='mx'||b.id==='mx2'){$('modal').classList.remove('open');return}
  if(b.id==='re'){panel('<p class="small mute">Running…</p>');setTimeout(()=>panel(runEvals()),30);return}if(b.id==='rs'){const r=S.role,sc=S.screen;S=seed();S.role=r;S.screen=sc;render();panel('<p class="small">Demo data reset.</p>');return}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
  if(f.id==='lf'){S.screen='app';S.view=S.role==='cust'?'search':S.view;render()}
  else if(f.id==='sf'){S.q={date:$('qd').value||S.q.date,evt:$('qe').value,guests:Math.max(0,+$('qg').value||0),budget:+$('qb').value,area:$('qa').value};render()}
  else if(f.id==='cf'){const r=confirmBook(S,S.hall,S.q.date,{name:$('cn').value.trim()||'Customer',phone:$('cp').value,event:$('ce').value,guests:+$('cg').value||S.q.guests,food:S.food,decor:S.decor,code:S.cpn,mine:true});
    if(!r.ok){toast(r.why);S.view='detail';S.hall=null;render();return}clearInterval(ti);S.last=r.b.id;S.newId=r.b.id;S.ownerVenue=hl(r.b.hid).venueId;S.ownerHall=r.b.hid;S.otab='over';const bd=new Date(parse(r.b.date));S.calM=Math.max(0,(bd.getFullYear()-2026)*12+bd.getMonth()-10);S.cpn='';S.view='done';render();toast('Payment successful · booking confirmed')}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='ov'){S.ownerVenue=t.value;S.ownerHall=null;S.newId=null;render()}else if(t.dataset.f){S.f[t.dataset.f]=t.value;soft()}else if(t.dataset.cmp){const i=S.cmp.indexOf(t.dataset.cmp);if(i<0){if(S.cmp.length>=3){t.checked=false;toast('Compare up to 3 venues');return}S.cmp.push(t.dataset.cmp)}else S.cmp.splice(i,1);soft()}else if(t.dataset.rule){S.rules[S.ownerVenue][t.dataset.rule]=+t.value;toast('Prices updated — customers see this now');soft()}});
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')$('modal').classList.remove('open')});
render();
}
</script>
</body></html>
